<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 100; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes pulse {
        0%, 100% { r: 2; opacity: 0.5; }
        50% { r: 4; opacity: 1; }
      }
      .hex-ring { animation: rotate 20s linear infinite; transform-origin: center; }
      .flow-path { animation: flow 3s linear infinite; stroke-dasharray: 100; }
      .signal-pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <!-- Gradient for depth -->
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D1C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B5AD;stop-opacity:0.7" />
    </linearGradient>
    
    <!-- Gradient for green -->
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A7F432;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7DC608;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background (invisible but defines viewBox) -->
  <rect width="200" height="200" fill="none"/>
  
  <!-- Outer hexagonal ring (rotating) -->
  <g class="hex-ring">
    <path d="M 100,30 L 150,60 L 150,120 L 100,150 L 50,120 L 50,60 Z" 
          fill="none" 
          stroke="url(#gradCyan)" 
          stroke-width="2" 
          opacity="0.4"/>
  </g>
  
  <!-- Middle hexagonal ring (counter-rotate) -->
  <g style="animation: rotate 30s linear infinite reverse;">
    <path d="M 100,50 L 135,75 L 135,125 L 100,150 L 65,125 L 65,75 Z" 
          fill="none" 
          stroke="url(#gradCyan)" 
          stroke-width="1.5" 
          opacity="0.6"/>
  </g>
  
  <!-- Infinity loop (core concept) -->
  <g opacity="0.8">
    <!-- Left loop -->
    <path d="M 80,100 Q 70,85 70,70 Q 70,55 85,50 Q 100,45 110,55 L 105,80 Q 100,75 90,75 Q 80,75 80,85 Q 80,100 90,110 Q 100,120 110,115" 
          fill="none" 
          stroke="url(#gradGreen)" 
          stroke-width="2.5"
          stroke-linecap="round"/>
    
    <!-- Right loop -->
    <path d="M 120,100 Q 130,115 130,130 Q 130,145 115,150 Q 100,155 90,145 L 95,120 Q 100,125 110,125 Q 120,125 120,115 Q 120,100 110,90 Q 100,80 90,85" 
          fill="none" 
          stroke="url(#gradGreen)" 
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>
  
  <!-- Flowing execution paths (subtle) -->
  <g class="flow-path" stroke="url(#gradCyan)" stroke-width="1.5" fill="none">
    <path d="M 50,100 Q 70,80 100,100 Q 130,120 150,100"/>
  </g>
  
  <g class="flow-path" stroke="url(#gradGreen)" stroke-width="1.5" fill="none" style="animation-delay: 1s;">
    <path d="M 100,50 Q 110,75 100,100 Q 90,125 100,150"/>
  </g>
  
  <!-- Directional vector (subtle arrow indicating flow) -->
  <g opacity="0.5">
    <path d="M 140,100 L 155,100 M 150,95 L 155,100 L 150,105" 
          stroke="url(#gradCyan)" 
          stroke-width="1.5" 
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
  
  <!-- Signal pulses at key points -->
  <circle class="signal-pulse" cx="100" cy="70" r="2" fill="url(#gradCyan)"/>
  <circle class="signal-pulse" cx="130" cy="100" r="2" fill="url(#gradGreen)" style="animation-delay: 0.5s;"/>
  <circle class="signal-pulse" cx="100" cy="130" r="2" fill="url(#gradCyan)" style="animation-delay: 1s;"/>
  <circle class="signal-pulse" cx="70" cy="100" r="2" fill="url(#gradGreen)" style="animation-delay: 1.5s;"/>
</svg>
